<!-- admin/signup.html -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Account — OLUMOSIX Admin</title>
<link rel="stylesheet" href="css/admin.css">
<link rel="icon" type="image/x-icon" href="../assets/icons/favicon.ico">
<link rel="apple-touch-icon" sizes="180x180" href="../assets/icons/apple-touch-icon.png">
<link rel="manifest" href="../site.webmanifest">
<meta name="theme-color" content="#2B1D14">
</head>
<body>

<div class="login-wrap">
  <form class="login-card" id="signup-form">
    <img src="../assets/images/logo.png" alt="OLUMOSIX" class="site-logo">
    <h1>Create Account</h1>
    <p>Sign up here, then ask an existing admin to approve your access.</p>

    <label for="name">Full Name</label>
    <input type="text" id="name" required>

    <label for="email">Email</label>
    <input type="email" id="email" required>

    <label for="password">Password</label>
    <input type="password" id="password" minlength="6" required>

    <button type="submit" id="signup-btn">Create Account</button>
    <p id="signup-error"></p>
  </form>
</div>

<script type="module" src="js/signup.js"></script>
<script type="module" src="../js/load-logo.js"></script>
</body>
</html>
